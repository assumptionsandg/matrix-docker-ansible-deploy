# By default, we configure coturn's external IP address using the value specified for `ansible_host` in your `inventory/hosts` file.
# If this value is an external IP address, you can skip this section.
#
# If `ansible_host` is not the server's external IP address, you have 2 choices:
# 1. Uncomment the line below, to allow IP address auto-detection to happen (more on this below)
# 2. Uncomment and adjust the line below to specify an IP address manually
#
# By default, auto-detection will be attempted using the `https://ifconfig.co/json` API.
# Default values for this are specified in `matrix_coturn_turn_external_ip_address_auto_detection_*` variables in the coturn role
# (see `roles/custom/matrix-coturn/defaults/main.yml`).
#
# If your server has multiple IP addresses, you may define them in another variable which allows a list of addresses.
# Example: `matrix_coturn_turn_external_ip_addresses: ['1.2.3.4', '4.5.6.7']`
#
# matrix_coturn_turn_external_ip_address: ''
#
matrix_static_files_container_labels_base_domain_enabled: true

matrix_playbook_migration_validated_version: v2026.05.18.0

traefik_config_certificatesResolvers_acme_enabled: false
traefik_ssl_dir_enabled: true

traefik_provider_configuration_extension_yaml: |
  tls:
    certificates:
      - certFile: /ssl/cert.pem
        keyFile: /ssl/privkey.pem
    stores:
      default:
        defaultCertificate:
          certFile: /ssl/cert.pem
          keyFile: /ssl/privkey.pem

  http:
    routers:
      synapse-openid-router:
        rule: "Host(`matrix.hollie.internal`) && PathPrefix(`/_matrix/federation/v1/openid/userinfo`)"
        service: synapse-openid-service
        entryPoints:
          - web-secure
        tls: {}
      jellyfin-router:
        rule: "Host(`jellyfin.hollie.internal`)"
        service: jellyfin-service
        entryPoints:
          - web-secure
        tls: {}

    services:
      synapse-openid-service:
        loadBalancer:
          servers:
            - url: "http://matrix-synapse:8048"
      jellyfin-service:
        loadBalancer:
          servers:
            - url: "http://192.168.1.7:8096"

aux_file_definitions:
  - dest: "{{ traefik_ssl_dir_path }}/privkey.pem"
    src: "{{ inventory_dir }}/host_vars/hollie.internal/privkey.pem"
  - dest: "{{ traefik_ssl_dir_path }}/cert.pem"
    src: "{{ inventory_dir }}/host_vars/hollie.internal/cert.pem"

matrix_synapse_enable_registration: true
matrix_synapse_enable_registration_without_verification: true
matrix_synapse_federation_enabled: false
matrix_synapse_federation_port_openid_resource_required: true

matrix_element_call_enabled: true
matrix_ketesa_enabled: true

matrix_static_files_file_matrix_server_property_m_server: "matrix.hollie.internal:443"

matrix_livekit_jwt_service_container_additional_arguments:
  - "--volume=/local/kurisu/docker-data/certs/cert.pem:/ca.crt:ro"

matrix_livekit_jwt_service_environment_variables_extension: |
  SSL_CERT_FILE=/ca.crt

matrix_playbook_docker_installation_daemon_options_custom:
  dns:
    - "192.168.1.7"

prometheus_enabled: true
prometheus_node_exporter_enabled: true
prometheus_postgres_exporter_enabled: true

grafana_enabled: true
matrix_server_fqn_grafana: "monitoring.{{ matrix_domain }}"
grafana_default_admin_user: "hollie"
grafana_default_admin_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  35343766363165393232306534333937623163663834306663636433353038373739353966656534
  3464653230303238663766663139633565396636626565340a353161343063656231653539306331
  65313738666433613434326334623362636635333262323265333362323262653531386633316131
  3934623836353862370a373930313666613636353031633562383338656137353737653662343135
  66363737323234333462383137303836636666333739636466323737646631663335

matrix_metrics_exposure_enabled: true
